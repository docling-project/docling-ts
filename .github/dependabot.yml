version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/docling-core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      core-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/docling-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      client-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/docling-components"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      components-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
