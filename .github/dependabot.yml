version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/docling-core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/docling-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/docling-components"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
