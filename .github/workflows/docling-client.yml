name: Docling Client

on:
  pull_request:
    paths:
      - 'docling-client/**'
      - '.github/workflows/docling-client.yml'
  push:
    branches:
      - main
    paths:
      - 'docling-client/**'
      - '.github/workflows/docling-client.yml'
    tags:
      - 'docling-client/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docling-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docling-client/package-lock.json
      - run: npm ci
      - run: npm run check

  release:
    needs: check
    if: >
      github.event_name == 'workflow_dispatch' &&
      contains(vars.RELEASE_ACTORS, github.actor)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: docling-client
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.version }}" --no-workspaces-update \
            --message "chore(release): docling-client v%s" \
            --tag-version-prefix "docling-client/v"
          git push --follow-tags

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/docling-client/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: docling-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: docling-client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `@docling/docling-client ${context.ref.replace('refs/tags/', '')}`,
              generate_release_notes: true,
            });
