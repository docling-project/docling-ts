name: Docling Components

on:
  pull_request:
    paths:
      - 'docling-components/**'
      - '.github/workflows/docling-components.yml'
  push:
    branches:
      - main
    paths:
      - 'docling-components/**'
      - '.github/workflows/docling-components.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docling-components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docling-components/package-lock.json
      - run: npm ci
      - run: npm run check
